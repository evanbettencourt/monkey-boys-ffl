name: Publish playoff editions
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate latest completed edition
        run: node scripts/publish-playoff-edition.mjs
      - name: Commit new edition
        run: |
          if git diff --quiet -- data/playoff-editions; then
            echo "No new completed week to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playoff-editions
          git commit -m "Publish playoff prediction edition"
          git push
